type Player {
  playerId: ID!
  username: String!
  email: String!
  createdAt: AWSDateTime!
  pinpointEndpointId: String
  pushEnabled: Boolean!
}

type Group {
  groupId: ID!
  name: String!
  creatorId: ID!
  adminIds: [ID!]!
  inviteCode: String!
  readInGameName: String
  createdAt: AWSDateTime!
}

type Member {
  playerId: ID!
  groupId: ID!
  username: String
  joinedAt: AWSDateTime!
  isReadIn: Boolean!
  readInConfirmedAt: AWSDateTime
}

type Confirmation {
  outcome: ResolutionOutcome!
  punishment: PunishmentType!
  submittedAt: AWSDateTime!
}

type SlapDebt {
  debtId: ID!
  groupId: ID!
  gameType: GameType!
  status: DebtStatus!
  challengerId: ID!
  statementMakerId: ID!
  statement: String!
  debtorId: ID
  creditorId: ID
  debtPunishment: PunishmentType
  challengerConfirmation: Confirmation
  statementMakerConfirmation: Confirmation
  debtorDeliveryConfirmed: Boolean!
  creditorDeliveryConfirmed: Boolean!
  createdAt: AWSDateTime!
  resolvedAt: AWSDateTime
  deliveredAt: AWSDateTime
}

# GSI4 denormalized index item — one per player per debt, sufficient to render My Slate cards
type PlayerDebtIndex {
  debtId: ID!
  groupId: ID!
  playerId: ID!
  role: String!
  status: DebtStatus!
  gameType: GameType!
  statement: String!
  challengerId: ID!
  statementMakerId: ID!
  debtorId: ID
  creditorId: ID
  debtPunishment: PunishmentType
  createdAt: AWSDateTime!
}

type ChugEvent {
  eventId: ID!
  groupId: ID!
  callerId: ID!
  chuggedPlayerIds: [ID!]!
  createdAt: AWSDateTime!
}

type FeedEntry {
  entryId: ID!
  groupId: ID!
  type: FeedEntryType!
  readInOnly: Boolean!
  refId: ID!
  actorId: ID!
  summary: String!
  createdAt: AWSDateTime!

  # Denormalised detail so the feed can say who did what to whom without
  # fetching the underlying debt per row. All nullable: entries written before
  # this existed have none of them, and the client falls back to `summary`.
  #
  # Ids, never names. Display names are editable, so a stored name would make
  # every historical entry lie the moment someone renamed themselves. The
  # client resolves these against the group's member list at render time.
  statement: String
  challengerId: ID
  statementMakerId: ID
  debtorId: ID
  creditorId: ID
  outcome: ResolutionOutcome
  punishment: PunishmentType
  amountMl: Float
}

enum GameType {
  manchester
  read_in
}

enum DebtStatus {
  pending
  pending_confirmation
  resolved
  delivered
}

enum ResolutionOutcome {
  followed_through
  did_not_follow_through
}

enum PunishmentType {
  slap
  infinity_grog
}

enum FeedEntryType {
  manchester_created
  manchester_resolved
  slap_delivered
  chug_event
  member_joined
}

enum LiquorCategory {
  vodka
  whiskey
  bourbon
  scotch
  irish_whiskey
  canadian_whiskey
  rum
  gin
  tequila
  brandy
  other
}

type GrogEntry {
  entryId: ID!
  category: LiquorCategory!
  brand: String!
  amountMl: Float!
}

type GrogHistoryEvent {
  eventId: ID!
  type: String!
  actorPlayerId: ID!
  occurredAt: AWSDateTime!
  sourceDebtId: ID
  brand: String
  category: LiquorCategory
  amountMl: Float
}

type PendingAddBack {
  debtId: ID!
  debtorId: ID!
  createdAt: AWSDateTime!
}

type Grog {
  groupId: ID!
  bottleSize: Float!
  entries: [GrogEntry!]!
  history: [GrogHistoryEvent!]!
  pendingAddBacks: [PendingAddBack!]!
}

input AddLiquorInput {
  category: LiquorCategory!
  brand: String!
  amountMl: Float
}

type Query {
  getGroups: [Group!]!
  getGroupMembers(groupId: ID!): [Member!]!
  getDebt(groupId: ID!, debtId: ID!): SlapDebt
  getDebts(groupId: ID!, status: DebtStatus): [SlapDebt!]!
  getMyDebts(groupId: ID!): [PlayerDebtIndex!]!
  getReadInPlayers(groupId: ID!): [Member!]!
  getChugEvents(groupId: ID!): [ChugEvent!]!
  getFeed(groupId: ID!): [FeedEntry!]!
  getGrog(groupId: ID!): Grog
}

type Mutation {
  designateAdmin(groupId: ID!, playerId: ID!): Group!
  regenerateInviteCode(groupId: ID!): Group!
  createChallenge(groupId: ID!, statementMakerId: ID!, statement: String!): SlapDebt!
  submitResolutionConfirmation(debtId: String!, groupId: ID!, outcome: ResolutionOutcome!, punishment: PunishmentType!): SlapDebt!
  confirmDelivery(debtId: String!, groupId: ID!): SlapDebt!
  voidDebt(debtId: String!, groupId: ID!): Boolean!
  confirmReadIn(groupId: ID!): Member!
  setReadInGameName(groupId: ID!, name: String!): Group!
  recordGameCall(groupId: ID!, callerId: ID!, chuggedPlayerIds: [ID!]!): ChugEvent!
  initializeGrog(groupId: ID!, bottleSize: Float!, seedEntries: [AddLiquorInput!]): Grog!
  addLiquorToGrog(groupId: ID!, category: LiquorCategory!, brand: String!): Grog!
  removeLiquorFromGrog(groupId: ID!, entryId: ID!): Grog!
  confirmGrogDelivery(groupId: ID!, debtId: ID!, addBack: AddLiquorInput): Grog!
  adjustGrogEntry(groupId: ID!, entryId: ID!, amountMl: Float!): Grog!
  takeGrogShot(groupId: ID!, debtId: ID!): Grog!
  redeemAddBack(groupId: ID!, debtId: ID!, category: LiquorCategory!, brand: String!): Grog!
  clearAddBack(groupId: ID!, debtId: ID!): Grog!
  adminAddBack(groupId: ID!, debtId: ID!, category: LiquorCategory!, brand: String!): Grog!
}

type Subscription {
  onGroupUpdated(groupId: ID!): Group
    @aws_subscribe(mutations: ["designateAdmin", "regenerateInviteCode", "setReadInGameName"])

  onDebtUpdated(groupId: ID!): SlapDebt
    @aws_subscribe(mutations: ["createChallenge", "submitResolutionConfirmation", "confirmDelivery"])

  onChugEventCreated(groupId: ID!): ChugEvent
    @aws_subscribe(mutations: ["recordGameCall"])
}
