type Player {
  playerId: ID!
  username: String!
  email: String!
  createdAt: AWSDateTime!
}

type Group {
  groupId: ID!
  name: String!
  creatorId: ID!
  adminIds: [ID!]!
  inviteCode: String!
  readInGameName: String
  createdAt: AWSDateTime!
}

type Member {
  playerId: ID!
  groupId: ID!
  username: String
  joinedAt: AWSDateTime!
  isReadIn: Boolean!
  readInConfirmedAt: AWSDateTime
}

type Confirmation {
  outcome: ResolutionOutcome!
  punishment: PunishmentType!
  submittedAt: AWSDateTime!
}

type SlapDebt {
  debtId: ID!
  groupId: ID!
  gameType: GameType!
  status: DebtStatus!
  challengerId: ID!
  statementMakerId: ID!
  statement: String!
  debtorId: ID
  creditorId: ID
  debtPunishment: PunishmentType
  challengerConfirmation: Confirmation
  statementMakerConfirmation: Confirmation
  debtorDeliveryConfirmed: Boolean!
  creditorDeliveryConfirmed: Boolean!
  createdAt: AWSDateTime!
  resolvedAt: AWSDateTime
  deliveredAt: AWSDateTime
}

# GSI4 denormalized index item — one per player per debt, sufficient to render My Slate cards
type PlayerDebtIndex {
  debtId: ID!
  groupId: ID!
  playerId: ID!
  role: String!
  status: DebtStatus!
  gameType: GameType!
  statement: String!
  challengerId: ID!
  statementMakerId: ID!
  debtorId: ID
  creditorId: ID
  debtPunishment: PunishmentType
  createdAt: AWSDateTime!
}

# The read-in game. A read-in player calls out other read-in players; each one
# answers covered or not. Once all have answered it settles: everyone not
# covered chugs, and if anyone was covered the caller chugs too. Every field
# that returns one is read-in only, enforced in the game-call Lambda.
type GameCall {
  callId: ID!
  groupId: ID!
  callerId: ID!
  calledPlayerIds: [ID!]!
  answers: [GameCallResponse!]!
  status: GameCallStatus!
  # Set once settled. Caller first when the call backfired.
  chuggerIds: [ID!]
  backfired: Boolean
  createdAt: AWSDateTime!
  settledAt: AWSDateTime
}

# The group's own rules for the read-in game, written by its admins. The app
# ships the mechanics; this is the part only the group knows. Read-in only.
type ReadInRules {
  groupId: ID!
  # Empty until an admin writes some.
  text: String!
  updatedBy: ID
  updatedAt: AWSDateTime
}

type GameCallResponse {
  playerId: ID!
  answer: GameCallAnswer!
  # Who recorded it: the player, or the caller answering for them. Null on
  # answers recorded before this existed.
  answeredBy: ID
}

enum GameCallStatus {
  open
  settled
}

enum GameCallAnswer {
  covered
  not_covered
}

type FeedEntry {
  entryId: ID!
  groupId: ID!
  type: FeedEntryType!
  readInOnly: Boolean!
  refId: ID!
  actorId: ID!
  summary: String!
  createdAt: AWSDateTime!

  # Denormalised detail so the feed can say who did what to whom without
  # fetching the underlying debt per row. All nullable: entries written before
  # this existed have none of them, and the client falls back to `summary`.
  #
  # Ids, never names. Display names are editable, so a stored name would make
  # every historical entry lie the moment someone renamed themselves. The
  # client resolves these against the group's member list at render time.
  statement: String
  challengerId: ID
  statementMakerId: ID
  debtorId: ID
  creditorId: ID
  outcome: ResolutionOutcome
  punishment: PunishmentType
  amountMl: Float

  # Read-in game entries. getFeed nulls these, and sets redacted, for anyone
  # who is not read in.
  calledPlayerIds: [ID!]
  chuggerIds: [ID!]
  redacted: Boolean
}

enum GameType {
  manchester
  read_in
}

enum DebtStatus {
  pending
  pending_confirmation
  resolved
  delivered
}

enum ResolutionOutcome {
  followed_through
  did_not_follow_through
}

enum PunishmentType {
  slap
  infinity_grog
}

enum FeedEntryType {
  manchester_created
  manchester_resolved
  slap_delivered
  # Written by the retired recordGameCall; old rows only.
  chug_event
  member_joined
  game_called
  game_settled
  # A shot from the grog that no Manchester asked for. refId is the shot's own
  # id, so it threads alone; statement carries the drinker's reason, if any.
  grog_shot
}

enum LiquorCategory {
  vodka
  whiskey
  bourbon
  scotch
  irish_whiskey
  canadian_whiskey
  rum
  gin
  tequila
  brandy
  other
}

type GrogEntry {
  entryId: ID!
  category: LiquorCategory!
  brand: String!
  amountMl: Float!
}

type GrogHistoryEvent {
  eventId: ID!
  type: String!
  actorPlayerId: ID!
  occurredAt: AWSDateTime!
  sourceDebtId: ID
  brand: String
  category: LiquorCategory
  amountMl: Float
}

type PendingAddBack {
  debtId: ID!
  debtorId: ID!
  createdAt: AWSDateTime!
}

type Grog {
  groupId: ID!
  bottleSize: Float!
  entries: [GrogEntry!]!
  history: [GrogHistoryEvent!]!
  pendingAddBacks: [PendingAddBack!]!
}

input AddLiquorInput {
  category: LiquorCategory!
  brand: String!
  amountMl: Float
}

type Query {
  getGroups: [Group!]!
  getGroupMembers(groupId: ID!): [Member!]!
  getDebt(groupId: ID!, debtId: ID!): SlapDebt
  getDebts(groupId: ID!, status: DebtStatus): [SlapDebt!]!
  getMyDebts(groupId: ID!): [PlayerDebtIndex!]!
  getReadInPlayers(groupId: ID!): [Member!]!
  getGameCalls(groupId: ID!): [GameCall!]!
  getReadInRules(groupId: ID!): ReadInRules!
  getFeed(groupId: ID!): [FeedEntry!]!
  getGrog(groupId: ID!): Grog
}

type Mutation {
  designateAdmin(groupId: ID!, playerId: ID!): Group!
  regenerateInviteCode(groupId: ID!): Group!
  createChallenge(groupId: ID!, statementMakerId: ID!, statement: String!): SlapDebt!
  submitResolutionConfirmation(debtId: String!, groupId: ID!, outcome: ResolutionOutcome!, punishment: PunishmentType!): SlapDebt!
  confirmDelivery(debtId: String!, groupId: ID!): SlapDebt!
  voidDebt(debtId: String!, groupId: ID!): Boolean!
  leaveGroup(groupId: ID!): Boolean!
  confirmReadIn(groupId: ID!): Member!
  setReadInGameName(groupId: ID!, name: String!): Group!
  callGame(groupId: ID!, calledPlayerIds: [ID!]!): GameCall!
  setReadInRules(groupId: ID!, text: String!): ReadInRules!
  # playerId: whose answer. Omit to answer for yourself; the caller may answer
  # for anyone they called.
  respondToGameCall(groupId: ID!, callId: ID!, covered: Boolean!, playerId: ID): GameCall!
  initializeGrog(groupId: ID!, bottleSize: Float!, seedEntries: [AddLiquorInput!]): Grog!
  addLiquorToGrog(groupId: ID!, category: LiquorCategory!, brand: String!): Grog!
  removeLiquorFromGrog(groupId: ID!, entryId: ID!): Grog!
  adjustGrogEntry(groupId: ID!, entryId: ID!, amountMl: Float!): Grog!
  takeGrogShot(groupId: ID!, debtId: ID!): Grog!
  takeFreeGrogShot(groupId: ID!, reason: String): Grog!
  redeemAddBack(groupId: ID!, debtId: ID!, category: LiquorCategory!, brand: String!): Grog!
  clearAddBack(groupId: ID!, debtId: ID!): Grog!
  adminAddBack(groupId: ID!, debtId: ID!, category: LiquorCategory!, brand: String!): Grog!
}

type Subscription {
  onGroupUpdated(groupId: ID!): Group
    @aws_subscribe(mutations: ["designateAdmin", "regenerateInviteCode", "setReadInGameName"])

  onDebtUpdated(groupId: ID!): SlapDebt
    @aws_subscribe(mutations: ["createChallenge", "submitResolutionConfirmation", "confirmDelivery"])
}
